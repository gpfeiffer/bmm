# H(G16): the group, the BFS basis A and the z^k-basis B (the fields are explained at the top of lib/spec.jl)
name         = "G16"
order        = 600
letters      = ["s", "t"]                 # letter 1 = s, 2 = t; letter 3 = z
orders       = [5, 5]
classes      = [1, 1]                     # one class of reflections
params       = [["d0", "d1", "d2", "d3", "d4"]]   # T^5 = d4 T^4 + d3 T^3 + d2 T^2 + d1 T + d0 (d0 invertible)
chevie_group = 16
chevie       = [1, 2]
braid        = ["1,2,1 = 2,1,2"]
parabolic    = 1                          # U = <s>
zword        = "1,2,1,2,1,2"              # z = (s t)^3, central of order 10
zstep        = 2                          # B is a z^2-basis (no z-basis of this shape was found)
zlevels      = 5
pipower      = 10                         # T_pi = T_z^10 = (T_s T_t)^30
bfs          = "1,3,2"                    # the order o = (s, z, t) of BFS_o; BFS_o is quasi-symmetric
basis        = "basis16.txt"
table        = "cosettable16.txt"
trace        = "0,1,0"                    # (J,i,m) of E_j (bmm.pdf §4.3; Table 1): τ(T_z^(kJ) h) = coefficient of T_u^m T_(w_i) in h
bmm_table    = "-d0^7610"

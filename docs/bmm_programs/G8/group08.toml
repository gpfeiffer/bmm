# H(G8): the group, the BFS basis A and the z^k-basis B (the fields are explained at the top of lib/spec.jl)
name         = "G8"
order        = 96
letters      = ["s", "t"]        # letter 1 = s, 2 = t; letter 3 = z
orders       = [4, 4]
classes      = [1, 1]                     # one class of reflections
params       = [["a0", "a1", "a2", "a3"]]   # T^k = r_(k-1) T^(k-1) + ... + r_0 for each class, constant term first (invertible)
chevie_group = 8
chevie       = [1, 2]
braid        = ["1,2,1 = 2,1,2"]   # s t s = t s t
parabolic    = 1                          # U = <s>
zword        = "1,2,1,2,1,2"               # z = (s t)^3, central of order 4
zstep        = 1
zlevels      = 4
pipower      = 4                          # T_pi = T_z^4
bfs          = "1,2"
basis        = "basis08.txt"
table        = "cosettable08.txt"
trace        = "0,1,0"                        # (J,i,m) of E_j (bmm.pdf §4.3; Table 1): τ(T_z^(kJ) h) = coefficient of T_u^m T_(w_i) in h

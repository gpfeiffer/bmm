# H(G15): the group, the BFS basis A and the z^k-basis B (the fields are explained at the top of lib/spec.jl)
name         = "G15"
order        = 288
letters      = ["s", "t", "u"]     # letter 1 = s, 2 = t, 3 = u; letter 4 = z
orders       = [2, 3, 2]
classes      = [1, 2, 3]                     # 3 classes of reflections: {s}, {t}, {u}
params       = [["e0", "e1"], ["c0", "c1", "c2"], ["f0", "f1"]]   # T^k = r_(k-1) T^(k-1) + ... + r_0 for each class, constant term first (invertible)
chevie_group = 15
chevie       = [1, 2, 3]
braid        = ["3,1,2 = 1,2,3", "2,3,1,2,1 = 3,1,2,1,2"]   # u s t = s t u, t u s t s = u s t s t
parabolic    = 2                          # U = <t>
zword        = "2,3,1,2,1"                 # z = t u s t s = u s t s t (Δ of the second braid relation), central of order 12
zstep        = 1
zlevels      = 12
pipower      = 12                          # T_pi = T_z^12
bfs          = "1,2,4"                    # the order o = (s, t, z) of BFS_o; BFS_o is quasi-symmetric
basis        = "basis15.txt"
table        = "cosettable15.txt"
trace        = "0,1,0"                    # (J,i,m) of E_j (bmm.pdf §4.3; Table 1): τ(T_z^(kJ) h) = coefficient of T_u^m T_(w_i) in h

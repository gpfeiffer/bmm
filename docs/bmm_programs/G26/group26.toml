chevie       = [1, 2, 3]
braid        = ["1,2,1,2 = 2,1,2,1", "2,3,2 = 3,2,3", "1,3 = 3,1"]
parabolic    = 2                          # U = <t>
zword        = "1,2,3,1,2,3,1,2,3"        # z = (s t u)^3, central of order 6
zstep        = 1
zlevels      = 6
pipower      = 6                          # T_pi = T_z^6
bfs          = "1,2,3"
basis        = "basis26.txt"
table        = "cosettable26.txt"
trace        = "0,1,0"                    # (J,i,m) of E_j (bmm.pdf §4.3; Table 1): τ(T_z^(kJ) h) = coefficient of T_u^m T_(w_i) in h
bmm_table    = "+c0^17412 e0^11016"

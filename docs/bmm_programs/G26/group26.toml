# H(G26): the group, the BFS basis A and the z^k-basis B (the fields are explained at the top of lib/spec.jl)
name         = "G26"
order        = 1296
letters      = ["s", "t", "u"]            # letter 1 = s, 2 = t, 3 = u; letter 4 = z
orders       = [2, 3, 3]

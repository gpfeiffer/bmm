# H(G12): the group, the BFS basis A and the z^k-basis B (the fields are explained at the top of lib/spec.jl)
name         = "G12"
order        = 48
letters      = ["s", "t", "u"]     # letter 1 = s, 2 = t, 3 = u; letter 4 = z
orders       = [2, 2, 2]
classes      = [1, 1, 1]                     # one class of reflections
params       = [["e0", "e1"]]   # T^k = r_(k-1) T^(k-1) + ... + r_0 for each class, constant term first (invertible)
chevie_group = 12
chevie       = [1, 2, 3]
braid        = ["1,2,3,1 = 2,3,1,2", "1,2,3,1 = 3,1,2,3"]   # s t u s = t u s t, s t u s = u s t u
parabolic    = 1                          # U = <s>
zword        = "1,2,3,1,2,3,1,2,3,1,2,3"   # z = (s t u)^4 = Δ^3, Δ = s t u s = t u s t = u s t u, central of order 2
zstep        = 1
zlevels      = 2
pipower      = 2                          # T_pi = T_z^2
bfs          = "1,2,3"
basis        = "basis12.txt"
table        = "cosettable12.txt"
trace        = "0,1,0"                        # (J,i,m) of E_j (bmm.pdf §4.3; Table 1): τ(T_z^(kJ) h) = coefficient of T_u^m T_(w_i) in h

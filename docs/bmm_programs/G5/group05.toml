# H(G5): the group, the BFS basis A and the z^k-basis B (the fields are explained at the top of lib/spec.jl)
name         = "G5"
order        = 72
letters      = ["s", "t"]        # letter 1 = s, 2 = t; letter 3 = z
orders       = [3, 3]
classes      = [1, 2]                     # 2 classes of reflections: {s}, {t}
params       = [["c0", "c1", "c2"], ["b0", "b1", "b2"]]   # T^k = r_(k-1) T^(k-1) + ... + r_0 for each class, constant term first (invertible)
chevie_group = 5
chevie       = [1, 2]
braid        = ["1,2,1,2 = 2,1,2,1"]   # s t s t = t s t s
parabolic    = 1                          # U = <s>
zword        = "1,2,1,2"                   # z = (s t)^2 (Δ of the braid relation s t s t = t s t s), central of order 6
zstep        = 1
zlevels      = 6
pipower      = 6                          # T_pi = T_z^6
bfs          = "1,2"
basis        = "basis05.txt"
table        = "cosettable05.txt"
trace        = "0,1,0"                        # (J,i,m) of E_j (bmm.pdf §4.3; Table 1): τ(T_z^(kJ) h) = coefficient of T_u^m T_(w_i) in h
